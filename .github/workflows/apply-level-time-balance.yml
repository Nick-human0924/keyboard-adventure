name: Apply level time balance

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-level-time-balance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch level timing
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(file, from, to) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) {
              throw new Error(`Pattern not found in ${file}: ${from.slice(0, 120)}`);
            }
            text = text.replace(from, to);
            fs.writeFileSync(file, text);
          }

          replaceOnce(
            'src/gameData.ts',
            "      { name: '热身', nameEn: 'Warm-up', typeWeights: { letter: 0, combo: 0, word: 1, phrase: 0 }, maxStage: 4, timeMultiplier: 0.7, count: 5 },",
            "      { name: '热身', nameEn: 'Warm-up', typeWeights: { letter: 0, combo: 0, word: 1, phrase: 0 }, maxStage: 4, timeMultiplier: 0.6, count: 5 },"
          );

          replaceOnce(
            'src/gameData.ts',
            "      { name: '热身', nameEn: 'Warm-up', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 6, timeMultiplier: 0.6, count: 5 },\n      { name: '主力', nameEn: 'Main', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 6, timeMultiplier: 0.4, count: 6 },\n      { name: '挑战', nameEn: 'Challenge', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 7, timeMultiplier: 0.5, count: 5 },",
            "      { name: '热身', nameEn: 'Warm-up', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 6, timeMultiplier: 0.55, count: 5 },\n      { name: '主力', nameEn: 'Main', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 6, timeMultiplier: 0.35, count: 6 },\n      { name: '挑战', nameEn: 'Challenge', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 7, timeMultiplier: 0.38, count: 5 },"
          );

          replaceOnce(
            'src/gameData.ts',
            "      { name: '热身', nameEn: 'Warm-up', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 6, timeMultiplier: 0.5, count: 6 },\n      { name: '主力', nameEn: 'Main', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 7, timeMultiplier: 0.35, count: 7 },\n      { name: '挑战', nameEn: 'Challenge', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 7, timeMultiplier: 0.5, count: 7 },",
            "      { name: '热身', nameEn: 'Warm-up', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 6, timeMultiplier: 0.5, count: 5 },\n      { name: '主力', nameEn: 'Main', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 7, timeMultiplier: 0.32, count: 6 },\n      { name: '挑战', nameEn: 'Challenge', typeWeights: { letter: 0, combo: 0, word: 0, phrase: 1 }, maxStage: 7, timeMultiplier: 0.38, count: 5 },"
          );

          replaceOnce(
            'src/gameData.ts',
            "export function getTimeLimit(text: string, type: string, waveMultiplier: number): number {\n  // Base times increased for 6-year-old beginners (needs time to locate keys)\n  const baseTimes: Record<string, number> = { letter: 5, combo: 5, word: 7, phrase: 11 };\n  const base = baseTimes[type] || 5;\n  const lengthBonus = Math.max(0, text.length - 3) * 1.0;\n  return Math.round((base + lengthBonus) * waveMultiplier);\n}",
            "export function getTimeLimit(text: string, type: string, waveMultiplier: number, levelId?: string | null): number {\n  // Base times increased for 6-year-old beginners (needs time to locate keys)\n  const baseTimes: Record<string, number> = { letter: 5, combo: 5, word: 7, phrase: 11 };\n  const base = baseTimes[type] || 5;\n  const lengthBonus = Math.max(0, text.length - 3) * 1.0;\n  const rawTime = Math.round((base + lengthBonus) * waveMultiplier);\n  const levelNumber = levelId?.startsWith('l') ? Number(levelId.slice(1)) : 0;\n  if (levelNumber >= 1 && levelNumber <= 15) return Math.max(2, rawTime - 1);\n  return rawTime;\n}"
          );

          for (const from of [
            "getTimeLimit(c.text, c.type, wave.timeMultiplier) + s.player.timeBoost + sandBonus",
            "getTimeLimit(c.text, c.type, wave.timeMultiplier) + s.player.timeBoost + (s.player.timeSandBattles > 0 ? 3 : 0)"
          ]) {
            replaceOnce('src/App.tsx', from, from.replace('wave.timeMultiplier)', 'wave.timeMultiplier, s.currentLevelId)'));
          }
          replaceOnce(
            'src/App.tsx',
            "getTimeLimit(c.text, c.type, wave.timeMultiplier) + s.player.timeBoost + (s.player.timeSandBattles > 0 ? 3 : 0)",
            "getTimeLimit(c.text, c.type, wave.timeMultiplier, s.currentLevelId) + s.player.timeBoost + (s.player.timeSandBattles > 0 ? 3 : 0)"
          );
          NODE
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/apply-level-time-balance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameData.ts src/App.tsx .github/workflows/apply-level-time-balance.yml
          git commit -m "Balance level time limits"
          git push
